name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust and wasm-pack
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
            crates/solver/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/solver/Cargo.lock') }}-wasm-pack-0.15.0
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install wasm-pack
        run: |
          if wasm-pack --version 2>/dev/null | grep -q '^wasm-pack 0.15.0'; then
            echo "Using cached wasm-pack 0.15.0"
          else
            cargo install wasm-pack --version 0.15.0 --locked --force
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm test && npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
